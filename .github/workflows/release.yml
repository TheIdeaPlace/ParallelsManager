name: Release

# A tag like v1.1.0 builds Parallels Manager for Apple silicon,
# signs it with Developer ID, notarizes and staples the disk image, and
# publishes the GitHub release with release-notes/v<version>.md as its notes.
#
# Run by hand (Actions, Release, Run workflow), it does all of that except
# publishing, and keeps the disk image as the run's artifact: a rehearsal
# that proves signing and notarization work before a real tag.
#
# Secrets (set by The-Idea-Place-Projects/signing/sync-secrets.py, never by
# hand): MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD (Developer ID
# Application), NOTARY_KEY_P8, NOTARY_KEY_ID and NOTARY_ISSUER_ID (App Store
# Connect API key). Without them the job fails rather than publishing an
# unsigned app, which modern macOS won't open.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One version, in Info.plist: the tag must match it, and its notes must exist.
      - name: Version and release notes
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Info.plist's version $version."; exit 1
          fi
          [ -f "release-notes/v$version.md" ] \
            || { echo "::error::release-notes/v$version.md is missing."; exit 1; }

      - name: Tests
        run: swift test

      # Into a throwaway keychain in RUNNER_TEMP, never the login keychain,
      # deleted at the end whatever happens. (GHManage's tested steps.)
      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$CERT_P12" ] || { echo "::error::MACOS_CERTIFICATE_P12 isn't set (signing/sync-secrets.py)."; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Default keychains lock after 5 minutes, which would break a build partway.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign waits for a GUI prompt nothing can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write the notarization key
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          [ -n "$NOTARY_KEY_P8" ] || { echo "::error::NOTARY_KEY_P8 isn't set (signing/sync-secrets.py)."; exit 1; }
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          chmod 600 "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize and staple
        env:
          NOTARIZE: '1'
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./package-dmg.sh

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "ParallelsManager-$VERSION.dmg" > "ParallelsManager-$VERSION.dmg.sha256"
          cat "ParallelsManager-$VERSION.dmg.sha256"

      - name: Keep the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ParallelsManager-${{ env.VERSION }}
          path: |
            build/ParallelsManager-${{ env.VERSION }}.dmg
            build/ParallelsManager-${{ env.VERSION }}.dmg.sha256
          if-no-files-found: error

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Parallels Manager $VERSION" \
            --notes-file "release-notes/v$VERSION.md" \
            "build/ParallelsManager-$VERSION.dmg" \
            "build/ParallelsManager-$VERSION.dmg.sha256"

      - name: Remove the keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
