name: CI

# Every push to main and every pull request: the tests, an unsigned build of
# the app, and shellcheck on the scripts (the
# install scripts run unattended for a quarter of an hour, so a mistake there
# is expensive to find by hand).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tests
        run: swift test

      - name: Build (unsigned)
        run: ./build.sh --skip-sign

      - name: Check the scripts
        run: |
          brew install shellcheck >/dev/null
          for f in build.sh package-dmg.sh Sources/ParallelsManager/Resources/*.sh; do
            bash -n "$f"
          done
          shellcheck -S warning build.sh package-dmg.sh Sources/ParallelsManager/Resources/*.sh
